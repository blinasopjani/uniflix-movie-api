# Server
server.port=8080

# ---- DATABASE CONFIGURATION ----
# Vlerat reale vendosen tek application-local.properties (i gitignoruar)
# ose si variabla mjedisore (environment variables).
#
# Per PostgreSQL (Supabase):
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# ---- H2 Console (aktiv vetem per zhvillim lokal) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- OMDb API Key ----
# Vendos vleren reale tek application-local.properties ose si env variable OMDB_API_KEY
omdb.api.key=${OMDB_API_KEY:YOUR_OMDB_KEY_HERE}
